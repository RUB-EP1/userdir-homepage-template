[project]
name = "rub-ep1-homepage-template"
version = "0.0.1"
description = "Template for personal EP1 homepages"
requires-python = "~=3.14.0"
license = "MIT"
authors = [{ name = "Common Partial-Wave Analysis" }]
dependencies = ["quarto-cli"]

[dependency-groups]
doc = ["lychee-bin>=0.24.0"]

[tool.compwa.policy.github]
no-cd = true
no-github-actions = true

[tool.lychee]
cache = true
cache_exclude_status = "400.."
# [:] keeps Lychee from extracting regex patterns as URLs.
exclude = [
    '^https[:]//www\.ep1\.rub\.de/~username/',  # placeholder for an internal project page
    '^https[:]//www\.ep1\.rub\.de/~$',  # Lychee truncates the username placeholder
]
extensions = ["css", "md", "qmd"]
hidden = true
include_fragments = "anchor-only"
include_verbatim = true
max_cache_age = "7d"

[tool.poe.executor]
isolated = true
type = "uv"

[tool.poe.groups.doc]
heading = "Documentation"

[tool.poe.groups.doc.tasks.doc]
cmd = "quarto render docs --no-clean"

[tool.poe.groups.doc.tasks.doclive]
cmd = "quarto preview docs --port 7000"
help = "Set up a server to directly preview changes to the HTML pages"
executor = { group = "doc" }

[tool.poe.groups.doc.tasks.website]
help = "Build and publish the EP1 homepage"
sequence = [
    "_doc-clean",
    "_publish",
]

[tool.poe.groups.doc.tasks._doc-clean]
cmd = "quarto render docs"

[tool.poe.groups.doc.tasks._publish]
cmd = "uvx userdir-publish"
executor = { type = "simple" }

[tool.poe.groups.doc.tasks.linkcheck]
executor = { group = "doc" }
help = "Check external links in the documentation (requires internet connection)"
cmd = "lychee ."

[tool.poe.tasks.all]
help = "Run all continuous integration (CI) tasks locally"
sequence = ["style", "linkcheck", "doc"]

[tool.poe.tasks.style]
cmd = "prek run --all-files"

[tool.poe.tasks.upgrade]
executor = { type = "simple" }
help = "Upgrade lock files"
parallel = [
    "_upgrade-precommit",
    "_upgrade-uv",
]

[tool.poe.tasks._upgrade-precommit]
cmd = "prek autoupdate"
executor = { type = "simple" }

[tool.poe.tasks._upgrade-uv]
cmd = "uv lock --upgrade"
executor = { type = "simple" }

[tool.tombi.files]
exclude = ["**/uv.lock"]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.userdir-publish"
path = "https://raw.githubusercontent.com/RUB-EP1/userdir-publish/refs/heads/main/userdir-publish.schema.json"
include = ["pyproject.toml"]

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.4/compwa-policy.schema.json"
include = ["pyproject.toml"]

[tool.userdir-publish]
host = "ep1.rub.de"
htaccess-source = "docs"
keep = ["/*/"]
source = "docs/_build/html"
web-root = "~/WWW"
